name: GamePulse Live CI Pipeline

on:
  push:
    branches: [ main, dev, staging, 'release/*' ]
  pull_request:
    branches: [ main, dev, staging ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: 🔒 Secret Detection & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Secret Detection Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Audit Repository Patterns
        run: |
          echo "Scanning for accidental hardcoded secrets or production passwords..."
          ! grep -rn "JWT_SECRET=super-secret-key-change-in-production" backend/src/main/resources/ 2>/dev/null
          ! grep -rn "password=root" backend/src/main/resources/application.properties 2>/dev/null

  backend-ci:
    name: ☕ Backend Build, Lint & Test (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'backend/pom.xml'

      - name: Verify Backend Dependencies & Compile
        run: |
          cd backend
          mvn -B compile

      - name: Run Backend Unit & Integration Tests
        run: |
          cd backend
          mvn -B clean test

      - name: Backend Production Package Artifact
        run: |
          cd backend
          mvn -B package -DskipTests=true

      - name: Upload Backend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamepulse-backend-jar
          path: backend/target/*.jar
          retention-days: 7

  frontend-ci:
    name: ⚡ Frontend Build, Lint & Test (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Linter (ESLint)
        run: |
          cd frontend
          npm run lint

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm test -- --passWithNoTests

      - name: Production Vite Build
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_BASE_URL: "https://api.gamepulselive.com/api"
          VITE_APP_ENV: "production"

      - name: Upload Frontend Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamepulse-frontend-dist
          path: frontend/dist/
          retention-days: 7
