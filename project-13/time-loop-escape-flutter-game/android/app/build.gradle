def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (!flutterRoot) {
    flutterRoot = System.getenv('FLUTTER_ROOT') ?: System.getenv('FLUTTER_HOME')
}
if (!flutterRoot && java.lang.System.getProperty('flutter.sdk')) {
    flutterRoot = java.lang.System.getProperty('flutter.sdk')
}
if (!flutterRoot) {
    def pathEnv = System.getenv("PATH") ?: ""
    def flutterDir = pathEnv.split(File.pathSeparator).find { dir ->
        new File(dir, "flutter").exists() || new File(dir, "flutter.bat").exists()
    }
    if (flutterDir) {
        flutterRoot = new File(flutterDir).parent
    }
}
assert flutterRoot != null, "Flutter SDK path not found"

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def isModernFlutter = new File("$flutterRoot/packages/flutter_tools/gradle/build.gradle.kts").exists()

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
if (isModernFlutter) {
    apply plugin: 'dev.flutter.flutter-gradle-plugin'
} else {
    apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"
}

android {
    namespace "com.timeloopescapes.game"
    compileSdkVersion 35
    if (isModernFlutter) {
        ndkVersion flutter.ndkVersion
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.timeloopescapes.game"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
}
